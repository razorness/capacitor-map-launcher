# Mirrors @ionic/swiftlint-config, but lints only this repo's Swift sources (never node_modules).
included:
  - ios
  - example/ios/App/App
  - Package.swift
opt_in_rules:
  - implicitly_unwrapped_optional
  - file_name_no_space
  - force_unwrapping
  - function_default_parameter_at_end
  - lower_acl_than_parent
  - modifier_order
  - overridden_super_call
  - unowned_variable_capture
analyzer_rules:
  - unused_import
line_length:
  warning: 150
  ignores_function_declarations: true
  ignores_comments: true
  ignores_interpolated_strings: true
  ignores_urls: true
