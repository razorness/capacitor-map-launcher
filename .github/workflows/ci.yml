name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run eslint
      - run: pnpm test
      - run: pnpm run build
      - name: Check committed dist/ and README are up to date
        run: git diff --exit-code -- dist README.md
      - run: pnpm --filter capacitor-app run build

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - run: pnpm install --frozen-lockfile
      - run: pnpm run verify:android

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: SwiftLint
        run: |
          command -v swiftlint || brew install swiftlint
          pnpm run swiftlint lint
      - name: Build and test (Swift Package)
        run: |
          scheme=$(xcodebuild -list -json | jq -r '(.workspace // .project).schemes | (map(select(endswith("-Package")))[0]) // "CapacitorMapLauncher"')
          udid=$(xcrun simctl list devices available -j | jq -r '[.devices | to_entries[] | select(.key | test("iOS")) | .value[] | select(.name | startswith("iPhone"))] | last | .udid')
          echo "Testing scheme $scheme on simulator $udid"
          xcodebuild test -scheme "$scheme" -destination "id=$udid"
