name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository] -- documented local reusable-workflow syntax

  # Installs dependencies and builds, so it gets no publish rights. No cache: release
  # artifacts must not depend on cache entries other workflows could have written.
  pack:
    name: Pack
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Check tag matches package.json version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${version}"
            exit 1
          fi

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm pack --pack-destination package
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package
          path: package/*.tgz
          if-no-files-found: error
          retention-days: 7

  # The only job with an OIDC token. It installs and runs nothing from the repository
  # or the registry; it just publishes the tarball built above (npm trusted publishing).
  publish:
    name: Publish to npm
    needs: pack
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write # OIDC token for npm trusted publishing and provenance
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package
      - name: Publish
        run: |
          # trusted publishing needs npm >= 11.5.1; Node 24 bundles a newer npm
          node -e "const [a,b,c]=process.argv[1].split('.').map(Number);process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)" "$(npm --version)"
          tag=latest
          case "${GITHUB_REF_NAME}" in *-*) tag=next ;; esac
          npm publish ./*.tgz --provenance --access public --tag "$tag"
